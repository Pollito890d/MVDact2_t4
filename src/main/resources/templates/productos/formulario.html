<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Nuevo Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

    <h2 class="mb-3" th:text="${titulo}">Nuevo Producto</h2>

    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="card p-4 shadow-sm" style="max-width: 500px;">
        <div class="mb-3">
            <label class="form-label">Nombre del Producto</label>
            <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Mouse gamer">
        </div>
        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" th:field="*{precio}" class="form-control" required placeholder="0.00">
        </div>
        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <input type="text" th:field="*{categoria}" class="form-control" required placeholder="Ej: Accesorios">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Guardar Producto</button>
            <a th:href="@{/productos/listar}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

</body>
</html>
