<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Detalle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

    <div style="max-width: 500px;" th:if="${producto != null}">
        <h3 class="card-title text-success" th:text="${titulo}">Detalle</h3>
        <p><strong>ID:</strong> <span th:text="${producto.id}"></span></p>
        <p><strong>Nombre:</strong> <span th:text="${producto.nombre}"></span></p>
        <p><strong>Precio:</strong> <span th:text="'$' + ${producto.precio}"></span></p>
        <p><strong>Categoría:</strong> <span th:text="${producto.categoria}"></span></p>
        <p><strong>Cantidad disponible:</strong> <span th:text="${producto.cantidad}"></span></p>
        <a th:href="@{/productos/listar}">Volver al catálogo</a>
    </div>

    <div class="alert alert-danger" th:if="${producto == null}">
        Producto no encontrado. <a th:href="@{/productos/listar}">Volver</a>
    </div>

</body>
</html>
